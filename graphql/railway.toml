[build]
watchPatterns = ["graphql/**", "shared/**"]
installCommand = "corepack enable && pnpm install"
buildCommand = "pnpm --filter @highforthis/graphql build"

[deploy]
preDeployCommand = "pnpm --filter @highforthis/graphql db:push"
startCommand = "cd graphql && exec node dist/index.js"
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
