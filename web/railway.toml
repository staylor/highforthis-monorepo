[build]
watchPatterns = ["shared/**", "web/**", "admin/public/locales/**"]
installCommand = "corepack enable && pnpm install"
buildCommand = "pnpm --filter @highforthis/web build"

[deploy]
startCommand = "cd web && exec node --import remix/node-tsx server.ts"
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
