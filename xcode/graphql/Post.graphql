query Post($slug: String!) {
  post(slug: $slug) {
    id
    title
    editorState {
      root {
        children {
          ... on HeadingNode {
            tag
            children {
              ...TextNodes_linebreakNode
              ...TextNodes_textNode
            }
          }
          ... on ImageNode {
            image {
              id
              altText
              destination
              crops {
                fileName
                height
                width
              }
            }
          }
          ... on VideoNode {
            video {
              ...Video_video
            }
          }
          ... on ElementNode {
            type
            children {
              ...TextNodes_linebreakNode
              ...TextNodes_textNode
            }
          }
          ... on QuoteNode {
            children {
              ...TextNodes_linebreakNode
              ...TextNodes_textNode
            }
          }
          ... on CodeNode {
            children {
              ...TextNodes_linebreakNode
              ...TextNodes_textNode
            }
          }
        }
      }
    }
  }
}
