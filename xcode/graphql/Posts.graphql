query Posts($after: String, $first: Int!) {
  posts(after: $after, first: $first, status: PUBLISH) {
    edges {
      node {
        id
        slug
        title
        featuredMedia {
          id
          destination
          ... on ImageUpload {
            crops {
              fileName
              width
            }
          }
        }
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}
