query Posts($after: String, $first: Int!) {
  posts(after: $after, first: $first, status: PUBLISH) {
    edges {
      node {
        id
        slug
        title
        editorState {
          root {
            children {
              ... on ImageNode {
                image {
                  id
                  destination
                  crops {
                    fileName
                    width
                  }
                }
              }
            }
          }
        }
        featuredMedia {
          id
          destination
          ... on ImageUpload {
            crops {
              fileName
              width
            }
          }
        }
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}
