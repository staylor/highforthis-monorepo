name: Apple

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A push to a pull request cancels its older run, but a run on main that has started is never cut short by the next merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-26.04
    # Reading this workflow's runs and their jobs needs actions: read, and a job's permissions replace the workflow's.
    permissions:
      actions: read
      contents: read
    outputs:
      apple: ${{ steps.diff.outputs.apple }}
      schema: ${{ steps.diff.outputs.schema }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pull request is checked out as its merge commit, whose first parent is the base branch.
          base=HEAD^1
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # Diffing a push from main's previous head would miss an earlier push's app changes when that push's run
            # didn't build, test and upload them: it was cancelled, failed, or was replaced by a newer push while it
            # waited. So a push is diffed from the head of the last push or manual run on main that passed, or whose CI
            # and TestFlight jobs passed although a job outside CI's needs didn't. That head's app has been built,
            # tested and uploaded, by that run's Apple jobs or, when they were skipped, by an earlier run's. A pull
            # request from a fork's branch named main is listed under main too, so only pushes and manual runs count.
            base=''
            # Whether a run that didn't pass still uploaded the app: its CI job and all its TestFlight jobs passed.
            uploaded='.jobs | any(.name == "CI" and .conclusion == "success")
              and (map(select(.name | startswith("TestFlight")) | .conclusion) | length > 0 and all(. == "success"))'
            while read -r run conclusion sha; do
              if [ "$conclusion" = success ] || [ "$(gh run view "$run" --json jobs --jq "$uploaded")" = true ]; then
                base=$sha
                break
              fi
            done < <(gh run list --workflow apple.yml --branch main --status completed --limit 20 \
              --json databaseId,conclusion,event,headSha \
              --jq '.[] | select(.event == "push" or .event == "workflow_dispatch")
                | "\(.databaseId) \(.conclusion) \(.headSha)"')
            # The checkout has only the last two commits. Without a good run's head to diff from, everything runs.
            git fetch --quiet --depth=1 origin "$base" || true
          fi
          # Whether the diff changes a file the pattern matches, other than documentation.
          changed() {
            git diff --name-only "$base" HEAD | grep -v '\.md$' | grep -qE "$1"
          }
          apple=false
          schema=false
          # Documentation and this workflow don't change the app, so changing only them skips the Apple jobs.
          # To test a workflow change, run the workflow manually on its branch.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            apple=true
          elif changed '^(apple/|apollo-codegen-config\.json$)'; then
            apple=true
          elif changed '^graphql/schema\.graphql$'; then
            # Apollo iOS generates HighForThisAPI from the schema, so the generated code check runs, failing if
            # HighForThisAPI needs regenerating. The app itself is unchanged, so the other Apple jobs don't run.
            schema=true
          fi
          echo "apple=$apple" >> "$GITHUB_OUTPUT"
          echo "schema=$schema" >> "$GITHUB_OUTPUT"

  # The check for branch rules to require. Jobs skipped because the app didn't change count as passing, so
  # this has to run, and fail, when a job it needs fails or the run is cancelled. The step needs always() too,
  # because a step's condition implicitly includes success(), which is false once the run is cancelled.
  ci:
    name: CI
    if: always()
    needs: [changes, build, test, generated-code, format]
    runs-on: ubuntu-26.04
    steps:
      - name: Check results
        if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
        run: exit 1

  build:
    name: Build ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: ${{ matrix.runner || 'xcode-27' }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: ${{ matrix.developer-dir || '/Applications/Xcode_27.2.app/Contents/Developer' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            destination: generic/platform=iOS
          - name: macOS
            destination: generic/platform=macOS
          - name: tvOS
            destination: generic/platform=tvOS
          # Swift 6.2 infers main-actor isolation in places 6.4 doesn't, so check the image's default Xcode 26 too.
          - name: iOS, Xcode 26
            destination: generic/platform=iOS
            runner: macos-26
            developer-dir: /Applications/Xcode.app/Contents/Developer
          - name: tvOS, Xcode 26
            destination: generic/platform=tvOS
            runner: macos-26
            developer-dir: /Applications/Xcode.app/Contents/Developer
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@v5
      # The tests build Debug for the simulators, so this archives Release for devices, as an App Store build would.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project HighForThis.xcodeproj \
            -scheme HighForThis \
            -destination "${{ matrix.destination }}" \
            -archivePath "$RUNNER_TEMP/HighForThis.xcarchive" \
            -resultBundlePath Build.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
      # The result bundle counts every warning, from asset catalogs and the linker as well as the compiler, where
      # SWIFT_TREAT_WARNINGS_AS_ERRORS would only catch Swift's.
      - name: Check for warnings
        run: |
          warnings=$(xcrun xcresulttool get build-results --path Build.xcresult | jq .warningCount)
          if [ "$warnings" != 0 ]; then
            echo "::error::The build has $warnings warnings."
            exit 1
          fi

  test:
    name: Test (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: xcode-27
    # The longest runs take about 30 minutes, which leaves room to run the tests again after a failure that isn't the
    # app's.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iPhone
            platform: iOS
            device: iPhone 18 Pro
          # Built with the iOS 27.2 SDK, the app fills iPhone Duo's displays, with its bars down the side. simctl can't
          # fold or unfold the simulator, so the tests see the pose it boots in.
          - name: iPhone Duo
            platform: iOS
            device: iPhone Duo
          - name: iPad
            platform: iOS
            device: iPad Pro 11-inch (M5)
          - name: Apple TV
            platform: tvOS
            device: Apple TV 4K (3rd generation)
          # The Mac runs the unit tests alone.
          - name: Mac
            platform: macOS
            only-testing: HighForThisTests
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/apple-test
        with:
          name: ${{ matrix.name }}
          platform: ${{ matrix.platform }}
          device: ${{ matrix.device }}
          only-testing: ${{ matrix.only-testing }}

  # The deployment target is 26.0, and the image only has 27 simulators, so these download the 26.5 releases' builds:
  # asking for version 26.5 sometimes installs its release candidate.
  # The xcode-27 image 20261119.0378, with macOS 27.2 and the Xcode 27.3 beta's CoreSimulator, breaks simulators of a
  # downloaded runtime: downloads fail, boots and tests hang, and the test runner can't launch. Until a fixed image
  # ships, these still run on pull requests but aren't one of CI's needs, so a failure shows on the run without
  # blocking a merge or TestFlight. Once one ships, move these back into test's matrix, and pass build to the action
  # there again.
  test-older-runtimes:
    name: Test (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iPhone, iOS 26.5
            platform: iOS
            build: 23F77
            device: iPhone 17 Pro
          - name: iPad, iOS 26.5
            platform: iOS
            build: 23F77
            device: iPad Pro 11-inch (M5)
          - name: Apple TV, tvOS 26.5
            platform: tvOS
            build: 23L470
            device: Apple TV 4K (3rd generation)
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/apple-test
        with:
          name: ${{ matrix.name }}
          platform: ${{ matrix.platform }}
          build: ${{ matrix.build }}
          device: ${{ matrix.device }}

  # iOS 26.0 lacks the tab accessory API, so this checks the player's fallback. Its simulator often hangs while booting,
  # so it runs after a merge and on manual runs, not on pull requests. It isn't one of CI's needs: a failure marks the
  # run on main without holding up TestFlight.
  test-ios-26-0:
    name: Test (iPhone, iOS 26.0 player)
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.apple == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/apple-test
        with:
          name: iPhone, iOS 26.0 player
          platform: iOS
          build: 23A343
          device: iPhone 17 Pro
          only-testing: HighForThisUITests/NavigationTests/testPlayerStaysAvailableAcrossTabsAndCanBeStopped

  # Unlike the other jobs, this also runs when the schema changed and the app didn't.
  generated-code:
    name: Generated code
    needs: changes
    if: needs.changes.outputs.apple == 'true' || needs.changes.outputs.schema == 'true'
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # Fails when an operation or the schema changed without regenerating HighForThisAPI, or it was edited by hand.
      - name: Generate HighForThisAPI
        run: |
          sh apple/scripts/generate-api.sh
          git add --intent-to-add apple/HighForThisAPI
          if ! git diff --exit-code --stat apple/HighForThisAPI; then
            echo "::error::HighForThisAPI is out of date. Run pnpm codegen:ios and commit the result."
            exit 1
          fi

  format:
    name: Format
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: xcode-27
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@v5
      - name: Lint
        run: swift format lint --recursive --strict HighForThis HighForThisTests HighForThisUITests

  testflight:
    name: TestFlight ${{ matrix.name }}
    needs: [changes, ci]
    if: >-
      !cancelled() && needs.ci.result == 'success' && needs.changes.outputs.apple == 'true'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: xcode-27
    timeout-minutes: 45
    environment:
      name: testflight
      url: https://appstoreconnect.apple.com/apps/6480232697/testflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            destination: generic/platform=iOS
          - name: macOS
            destination: generic/platform=macOS
          - name: tvOS
            destination: generic/platform=tvOS
    defaults:
      run:
        working-directory: apple
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5
      # Archives are signed for development. Without that identity in the keychain, Xcode would create a new
      # certificate on every runner.
      - name: Install signing credentials
        env:
          ASC_KEY: ${{ secrets.ASC_KEY }}
          DEVELOPMENT_CERTIFICATE: ${{ secrets.DEVELOPMENT_CERTIFICATE }}
          DEVELOPMENT_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPMENT_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for name in ASC_KEY ASC_KEY_ID ASC_ISSUER_ID DEVELOPMENT_CERTIFICATE DEVELOPMENT_CERTIFICATE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The testflight environment has no $name secret."
              exit 1
            fi
          done
          printf '%s\n' "$ASC_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          base64 --decode <<< "$DEVELOPMENT_CERTIFICATE" > "$RUNNER_TEMP/development.p12"
          security import "$RUNNER_TEMP/development.p12" -k "$keychain" -P "$DEVELOPMENT_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/development.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          if ! security find-identity -v -p codesigning "$keychain" | grep -q '1 valid identities found'; then
            echo "::error::The development certificate is missing or has expired. Replace the signing secrets."
            exit 1
          fi
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project HighForThis.xcodeproj \
            -scheme HighForThis \
            -destination "${{ matrix.destination }}" \
            -archivePath "$RUNNER_TEMP/HighForThis.xcarchive" \
            -resultBundlePath "$RUNNER_TEMP/Archive.xcresult" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | xcbeautify --renderer github-actions
      - name: Check for warnings
        run: |
          warnings=$(xcrun xcresulttool get build-results --path "$RUNNER_TEMP/Archive.xcresult" | jq .warningCount)
          if [ "$warnings" != 0 ]; then
            echo "::error::The signed archive has $warnings warnings."
            exit 1
          fi
      # Xcode's export runs rsync with arguments only the system rsync accepts, so keep Homebrew's off the PATH.
      - name: Upload to TestFlight
        run: |
          PATH="/usr/bin:$PATH" xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/HighForThis.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove signing credentials
        if: always()
        run: |
          if [ -e "$RUNNER_TEMP/signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/development.p12"
