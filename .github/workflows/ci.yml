name: CI

on:
  pull_request:
    branches: ['*']

jobs:
  ci:
    name: Lint, Typecheck, Test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @highforthis/graphql db:generate
      - run: pnpm --filter @highforthis/admin exec react-router typegen
      # the root knip and typecheck scripts build @highforthis/shared first, so
      # packages importing its subpath exports (logger, observability) resolve
      - run: pnpm knip
      - run: pnpm typecheck
      - run: pnpm -r test
