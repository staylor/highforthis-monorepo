name: CI

on:
  pull_request:
    branches: ['*']

jobs:
  ci:
    name: Lint, Typecheck, Test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Fails when the schema or an operation changed without regenerating the TypeScript types,
      # or they were edited by hand
      - name: Check the generated GraphQL types
        run: |
          pnpm exec graphql-codegen
          if ! git diff --exit-code --stat -- graphql/schema.graphql graphql/types web/app/types; then
            echo "::error::The generated GraphQL types are out of date. Run pnpm codegen and commit the result."
            exit 1
          fi
      # the root knip and typecheck scripts build @highforthis/shared first, so
      # packages importing its subpath exports (logger, observability) resolve
      - run: pnpm knip
      - run: pnpm typecheck
      - run: pnpm -r test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: highforthis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/highforthis
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # The same steps as `pnpm db:setup`. pg_restore runs in the Postgres container, so its
      # version matches the server's, whatever the runner has installed.
      - run: pnpm --filter @highforthis/graphql db:migrate
      # Fails when src/database/tables.ts no longer describes the tables the migrations make
      - run: pnpm --filter @highforthis/graphql db:check
      - name: Load the seed data
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: >-
          docker exec --interactive "$POSTGRES_CONTAINER"
          pg_restore --username=postgres --dbname=highforthis
          --no-owner --no-privileges --data-only --disable-triggers --exit-on-error
          < graphql/dump/highforthis-seed.dump
      - run: pnpm --filter @highforthis/e2e exec playwright install --with-deps chromium
      # The post editor's tests run in a browser, from the root so the harness can reach pnpm's
      # node_modules
      - run: pnpm test:browser
      # Creates the test admin, builds web and starts the servers; CI turns on retries
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
