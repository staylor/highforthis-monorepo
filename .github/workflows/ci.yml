name: CI

on:
  pull_request:
    branches: ['*']

jobs:
  ci:
    name: Lint, Typecheck, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @highforthis/graphql db:generate
      - run: pnpm --filter @highforthis/web exec react-router typegen
      - run: pnpm knip
      # the root script builds @highforthis/shared first, so packages importing
      # its subpath exports (logger, observability) can resolve their types
      - run: pnpm typecheck
      - run: pnpm -r test
