name: Apple tests
description: Runs the app's tests on a simulator, or the unit tests on the Mac when there's no device.

inputs:
  name:
    description: The job's name, for the result bundle's artifact.
    required: true
  platform:
    description: iOS, tvOS or macOS.
    required: true
  build:
    description: A simulator runtime build to install, such as 23F77. Without one, the image's newest runtime is used.
    default: ''
  device:
    description: The simulator's device type, such as iPhone 18 Pro. Without one, the tests run on the Mac.
    default: ''
  only-testing:
    description: An -only-testing identifier, to run some of the tests.
    default: ''
  products:
    description: >-
      The name of an artifact with a build for testing's products in test-products.tar, which the tests run from
      instead of building the app. Without one, the tests build it.
    default: ''

runs:
  using: composite
  steps:
    # An artifact loses the executables' permissions, so the products come in a tar, which keeps them.
    - name: Download the test products
      if: inputs.products != ''
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.products }}
        path: ${{ runner.temp }}/test-products
    - name: Unpack the test products
      id: products
      if: inputs.products != ''
      shell: bash
      run: |
        tar -xf "$RUNNER_TEMP/test-products/test-products.tar" -C "$RUNNER_TEMP/test-products"
        set -- "$RUNNER_TEMP"/test-products/Products/*.xctestrun
        if [ ! -e "$1" ]; then
          echo "::error::The test products have no .xctestrun file."
          exit 1
        fi
        echo "xctestrun=$1" >> "$GITHUB_OUTPUT"
    - name: Install the simulator runtime
      if: inputs.build != ''
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        BUILD: ${{ inputs.build }}
      run: |
        # Apple's download server sometimes fails with a networking error that asks to try again later, so the
        # download is tried up to 3 times.
        for attempt in 1 2 3; do
          status=0
          xcodebuild -downloadPlatform "$PLATFORM" -buildVersion "$BUILD" -architectureVariant arm64 || status=$?
          if [ "$status" -eq 0 ]; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            exit "$status"
          fi
          echo "::warning::Downloading the $PLATFORM $BUILD runtime failed with $status, so it's being tried again in 30 seconds."
          sleep 30
        done
        # Deferred cleanup of stale runtime registrations can unmount the active simulator mid-test.
        # Keep the assets shared with their usable replacements, then remount those replacements.
        xcrun simctl runtime scan-and-mount
        xcrun simctl runtime list --json | jq -r '.[] | select(.state == "Unusable") | .identifier' |
          while IFS= read -r runtime; do
            xcrun simctl runtime delete "$runtime" --keep-asset
          done
        xcrun simctl runtime scan-and-mount
        # A simulator that boots before its runtime's dyld shared cache is built stays several times slower.
        xcrun simctl runtime dyld_shared_cache update --all
    - name: Pick a simulator
      id: simulator
      if: inputs.device != ''
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        BUILD: ${{ inputs.build }}
        DEVICE: ${{ inputs.device }}
        BOOT: ${{ github.action_path }}/boot-simulator.sh
      # Xcode can leave an older runtime's simulators out of its destinations, as Xcode 27.1 does with tvOS 27.0
      # once tvOS 27.2 is installed, so this uses the newest runtime for the device, adding the device to it when
      # it's missing. Runtimes made for one new model, such as iPhone Duo's, support only that model.
      run: |
        runtime=$(xcrun simctl list runtimes available --json |
          jq -r --arg platform "$PLATFORM" --arg build "$BUILD" --arg device "$DEVICE" '
            [.runtimes[] | select(.platform == $platform and ($build == "" or .buildversion == $build))
              | select(any(.supportedDeviceTypes[]?; .name == $device))]
            | sort_by(.version | split(".") | map(tonumber)) | last | .identifier // empty')
        if [ -z "$runtime" ]; then
          echo "::error::No $PLATFORM ${BUILD:-runtime} supports $DEVICE."
          exit 1
        fi
        udid=$(xcrun simctl list devices available --json | jq -r --arg runtime "$runtime" --arg device "$DEVICE" '
          [.devices[$runtime][]? | select(.name == $device)] | last | .udid // empty')
        if [ -z "$udid" ]; then
          udid=$(xcrun simctl create "$DEVICE" "$DEVICE" "$runtime")
        fi
        echo "udid=$udid" >> "$GITHUB_OUTPUT"
        echo "destination=id=$udid" >> "$GITHUB_OUTPUT"
        xcrun simctl list devices available | grep "$udid"
        bash "$BOOT" "$udid"
    # CI simulators sometimes time out reading the UI or fail to quit the app, so failed tests run up to 3 times. A UI
    # test can also hang in a wait that never returns, so each test is killed after 5 minutes, about twice the slowest
    # passing one. xcodebuild's own retries run a test that timed out again only in a new test runner, and with one
    # they ran every test again, 5 to 10 minutes for one flaky test. So a retry here is a new xcodebuild, which starts
    # a new runner, for only the tests that failed, read from the result bundle. xcodebuild exits with 65 when the
    # build or a test fails. Any other failure, such as xcodebuild crashing or losing the simulator, isn't the app's,
    # so the simulator is erased and the tests run once more. The Mac run retries neither, so a flaky race in the unit
    # tests still fails CI.
    #
    # Parallel testing is off on simulators: with the unit tests parallelizable, xcodebuild ran every test on a clone of
    # the simulator booted above, which booted cold after the build. Given test products, the tests run from them
    # without building; otherwise the build skips the index, which nothing on CI reads.
    - name: Test
      shell: bash
      working-directory: apple
      env:
        DESTINATION: ${{ steps.simulator.outputs.destination || 'platform=macOS' }}
        UDID: ${{ steps.simulator.outputs.udid }}
        ONLY_TESTING: ${{ inputs.only-testing }}
        XCTESTRUN: ${{ steps.products.outputs.xctestrun }}
        BOOT: ${{ github.action_path }}/boot-simulator.sh
      run: |
        # Runs the tests into the result bundle named first, with the arguments after it, such as -only-testing.
        run_tests() {
          local bundle=$1
          shift
          if [ -n "$XCTESTRUN" ]; then
            set -- test-without-building -xctestrun "$XCTESTRUN" "$@"
          else
            set -- test -project HighForThis.xcodeproj -scheme HighForThis "$@" \
              COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
          fi
          xcodebuild "$@" \
            -destination "$DESTINATION" \
            -resultBundlePath "$bundle" \
            ${UDID:+-parallel-testing-enabled NO} \
            ${UDID:+-test-timeouts-enabled YES -default-test-execution-time-allowance 300} \
            | xcbeautify --renderer github-actions
          return "${PIPESTATUS[0]}"
        }
        selection=(${ONLY_TESTING:+"-only-testing:$ONLY_TESTING"})
        status=0
        run_tests Tests.xcresult "${selection[@]}" || status=$?
        if [ -n "$UDID" ] && [ "$status" -ne 0 ] && [ "$status" -ne 65 ]; then
          echo "::warning::xcodebuild exited with $status, which isn't a test failure, so the simulator is being erased and the tests run again."
          if [ -e Tests.xcresult ]; then
            mv Tests.xcresult Tests-first-run.xcresult
          fi
          xcrun simctl shutdown "$UDID" || true
          xcrun simctl erase "$UDID"
          bash "$BOOT" "$UDID"
          status=0
          run_tests Tests.xcresult "${selection[@]}" || status=$?
        fi
        bundle=Tests.xcresult
        for retry in 1 2; do
          if [ -z "$UDID" ] || [ "$status" -ne 65 ]; then
            break
          fi
          failed=$(xcrun xcresulttool get test-results tests --path "$bundle" | jq -r '
            [.testNodes[] | .. | objects | select(.nodeType == "Unit test bundle" or .nodeType == "UI test bundle")
              | .name as $bundle | .. | objects | select(.nodeType == "Test Case" and .result == "Failed")
              | "\($bundle)/\(.nodeIdentifier)"] | unique | .[]') || failed=''
          # 65 without a failed test is a failed build, which running again won't fix.
          if [ -z "$failed" ]; then
            break
          fi
          echo "::warning::Running again on their own, as they failed:" $failed
          arguments=()
          while IFS= read -r test; do
            arguments+=("-only-testing:$test")
          done <<< "$failed"
          bundle=Tests-retry-$retry.xcresult
          status=0
          run_tests "$bundle" "${arguments[@]}" || status=$?
        done
        exit "$status"
    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: Tests (${{ inputs.name }}).xcresult
        path: apple/Tests*.xcresult
