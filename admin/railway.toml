[build]
watchPatterns = ["shared/**", "admin/**"]
installCommand = "corepack enable && pnpm install"
buildCommand = "pnpm --filter @highforthis/admin build"

[deploy]
startCommand = "cd admin && exec node server.js"
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
