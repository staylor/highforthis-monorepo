query Post($slug: String!) {
  post(slug: $slug) {
    id
    date
    title
    editorState {
      root {
        children {
          ... on ElementNodeType {
            type
            children {
              ...TextNodes_linebreakNode
              ...TextNodes_textNode
            }
          }
          ... on HeadingNode {
            tag
          }
          ... on ImageNode {
            image {
              id
              altText
              destination
              crops {
                fileName
                height
                width
              }
            }
          }
          ... on VideoNode {
            video {
              ...Video_video
            }
          }
        }
      }
    }
  }
}
