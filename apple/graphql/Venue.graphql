query Venue($slug: String!) {
  # Enough for every venue's shows, as the website lists them. View All opens the rest of any with more.
  attended: shows(attended: true, first: 100, venue: { slug: $slug }) {
    ...DatedShowsSection_shows
    count
  }
  shows(first: 100, latest: true, venue: { slug: $slug }) {
    ...DatedShowsSection_shows
  }
  venue(slug: $slug) {
    id
    address
    capacity
    name
    slug
    website
    coordinates {
      latitude
      longitude
    }
  }
}
