query Venue($slug: String!) {
  attended: shows(attended: true, first: 5, venue: { slug: $slug }) {
    ...DatedShowsSection_shows
    count
  }
  shows(first: 5, latest: true, venue: { slug: $slug }) {
    ...DatedShowsSection_shows
  }
  venue(slug: $slug) {
    id
    address
    capacity
    name
    slug
    website
    coordinates {
      latitude
      longitude
    }
  }
}
