query Artist($slug: String!) {
  artist(slug: $slug) {
    id
    name
    slug
    website
    appleMusic {
      id
      url
      artwork {
        height
        url
        width
      }
    }
  }
  attended: shows(artist: { slug: $slug }, attended: true, first: 5) {
    ...DatedShowsSection_shows
    count
  }
  shows(artist: { slug: $slug }, first: 5, latest: true) {
    ...DatedShowsSection_shows
  }
}
