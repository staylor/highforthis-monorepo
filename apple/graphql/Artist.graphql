query Artist($slug: String!) {
  artist(slug: $slug) {
    id
    name
    slug
    website
    appleMusic {
      id
      url
      artwork {
        height
        url
        width
      }
    }
  }
  # Enough for every artist's shows, as the website lists them. View All opens the rest of any with more.
  attended: shows(artist: { slug: $slug }, attended: true, first: 100) {
    ...DatedShowsSection_shows
    count
  }
  shows(artist: { slug: $slug }, first: 100, latest: true) {
    ...DatedShowsSection_shows
  }
}
